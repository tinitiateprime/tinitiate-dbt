version: 2

models:
  - name: stg_employees
    description: Cleaned employee records used by downstream analytics models.
    columns:
      - name: employee_id
        description: Unique identifier for an employee.
        data_tests:
          - not_null
          - unique
      - name: department_id
        description: Department assigned to the employee.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_departments')
                field: department_id
      - name: status
        description: Current employment status.
        data_tests:
          - accepted_values:
              arguments:
                values: ['ACTIVE', 'INACTIVE']

  - name: stg_departments
    description: Cleaned department reference data.
    columns:
      - name: department_id
        description: Unique identifier for a department.
        data_tests:
          - not_null
          - unique
